<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>/* {{STYLES}} */</style>
</head>
<body>
  <div id="app">
    <!-- ── Setup View ─────────────────────────────────────── -->
    <div id="setup-view" class="view">
      <div class="setup-container">
        <div class="setup-header">
          <div class="logo">AI</div>
          <h1>Comment Assistant</h1>
          <p class="subtitle">Set up your API keys to get started.</p>
        </div>
        <div class="form-group">
          <label for="claude-key">Claude API Key</label>
          <input
            type="password"
            id="claude-key"
            placeholder="sk-ant-api03-..."
            spellcheck="false"
          />
          <span class="hint">Get your key at console.anthropic.com</span>
        </div>
        <div class="form-group">
          <label for="figma-token">Figma Access Token</label>
          <input
            type="password"
            id="figma-token"
            placeholder="figd_..."
            spellcheck="false"
          />
          <span class="hint">Settings → Account → Personal access tokens</span>
        </div>
        <button id="save-keys-btn" class="btn-primary">Save &amp; Continue</button>
        <div id="setup-error" class="error-msg hidden"></div>
      </div>
    </div>

    <!-- ── Inbox View ─────────────────────────────────────── -->
    <div id="inbox-view" class="view hidden">
      <div class="inbox-header">
        <h2>Comments</h2>
        <div class="header-actions">
          <button id="refresh-btn" class="btn-icon" title="Refresh comments">&#8635;</button>
          <button id="settings-btn" class="btn-icon" title="Settings">&#9881;</button>
        </div>
      </div>
      <div id="inbox-stats" class="inbox-stats"></div>
      <div id="comment-list" class="comment-list"></div>
      <div id="inbox-empty" class="empty-state hidden">
        <p>No comments found in this file.</p>
        <button id="empty-refresh-btn" class="btn-secondary">Refresh</button>
      </div>
    </div>

    <!-- ── Focus View ─────────────────────────────────────── -->
    <div id="focus-view" class="view hidden">
      <button id="back-btn" class="btn-back">&larr; Back to list</button>
      <div id="focus-content">
        <div id="focus-comment" class="focus-section"></div>
        <div id="focus-proposal" class="focus-section"></div>
        <div id="focus-actions" class="focus-actions"></div>
      </div>
    </div>

    <!-- ── Edit Proposal Modal ────────────────────────────── -->
    <div id="edit-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Edit Proposal</h3>
        <textarea id="edit-textarea" rows="4" placeholder="Describe what you want..."></textarea>
        <div class="modal-actions">
          <button id="edit-cancel-btn" class="btn-secondary">Cancel</button>
          <button id="edit-submit-btn" class="btn-primary">Re-analyze</button>
        </div>
      </div>
    </div>

    <!-- ── Loading Overlay ────────────────────────────────── -->
    <div id="loading-overlay" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p id="loading-text">Loading...</p>
    </div>

    <!-- ── Toast ──────────────────────────────────────────── -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script>/* {{SCRIPT}} */</script>
</body>
</html>
